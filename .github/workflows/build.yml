name: Build Lord V2 APK

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Download Xray core (libv2ray.aar)
        continue-on-error: true
        run: |
          mkdir -p app/libs
          curl -fL --retry 3 -o app/libs/libv2ray.aar \
            https://github.com/2dust/AndroidLibXrayLite/releases/latest/download/libv2ray.aar \
            || rm -f app/libs/libv2ray.aar
          if [ -f app/libs/libv2ray.aar ] && [ $(stat -c%s app/libs/libv2ray.aar) -lt 1000000 ]; then rm -f app/libs/libv2ray.aar; fi
          ls -lh app/libs

      - name: Build APKs
        run: gradle :app:assembleDebug :app:assembleRelease --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: LordV2-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
