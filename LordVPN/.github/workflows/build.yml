name: Build APK
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download Xray core (libv2ray.aar) + geo files
        run: |
          mkdir -p app/libs app/src/main/assets
          curl -fsSL -o app/libs/libv2ray.aar \
            https://github.com/2dust/AndroidLibXrayLite/releases/latest/download/libv2ray.aar
          curl -fsSL -o app/src/main/assets/geoip.dat \
            https://github.com/Loyalsoldier/v2ray-rules-dat/releases/latest/download/geoip.dat
          curl -fsSL -o app/src/main/assets/geosite.dat \
            https://github.com/Loyalsoldier/v2ray-rules-dat/releases/latest/download/geosite.dat
          ls -lh app/libs app/src/main/assets

      - name: Build tun2socks (hev-socks5-tunnel) with NDK
        run: |
          NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          echo "Using NDK: $NDK"
          mkdir -p hev
          git clone --recursive --depth 1 https://github.com/heiher/hev-socks5-tunnel hev/jni
          cd hev
          "$NDK/ndk-build" \
            NDK_PROJECT_PATH=. APP_BUILD_SCRIPT=jni/Android.mk NDK_APPLICATION_MK=jni/Application.mk \
            APP_ABI="arm64-v8a armeabi-v7a x86_64" APP_PLATFORM=android-24 \
            APP_CFLAGS="-O3 -DPKGNAME=com/lord/vpn" \
            -j"$(nproc)"
          mkdir -p ../app/src/main/jniLibs
          cp -r libs/* ../app/src/main/jniLibs/
          find ../app/src/main/jniLibs -name "*.so"

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build APK
        run: gradle assembleRelease --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: LordVPN-apk
          path: app/build/outputs/apk/release/*.apk
